name: FieldAtlas
options:
  bundleIdPrefix: ru.archiverf
  deploymentTarget:
    iOS: '17.0'
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  FieldCore:
    path: FieldCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  FieldAtlas:
    type: application
    platform: iOS
    sources: [FieldAtlas]
    dependencies:
      - package: MapLibre
      - package: FieldCore
    info:
      path: FieldAtlas/Info.plist
      properties:
        CFBundleDisplayName: Полевой атлас
        CFBundleShortVersionString: '0.4.2'
        CFBundleVersion: '12'
        CFBundleURLTypes:
          - CFBundleURLName: ru.archiverf.fieldatlas.oauth
            CFBundleURLSchemes: [archiverf-atlas]
        NSMotionUsageDescription: Барометр предлагает смену этажа. Номер этажа всегда подтверждается вручную.
        NSCameraUsageDescription: Камера нужна для съёмки объектов, надписей и LiDAR.
        NSLocationWhenInUseUsageDescription: Координаты нужны для записи границ, дорожек и положения объектов.
        UIBackgroundModes: [location]
        NSPhotoLibraryUsageDescription: Выберите фотографию для карточки объекта.
        NSLocalNetworkUsageDescription: Подключение к локальному серверу для передачи материалов.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.archiverf.fieldatlas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Simulator.entitlements
  FieldAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FieldAtlasTests]
    dependencies:
      - target: FieldAtlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ru.archiverf.fieldatlas.tests
  FieldAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FieldAtlasUITests]
    dependencies:
      - target: FieldAtlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ru.archiverf.fieldatlas.uitests
schemes:
  FieldAtlas:
    build:
      targets:
        FieldAtlas: all
    test:
      targets:
        - FieldAtlasTests
        - FieldAtlasUITests
